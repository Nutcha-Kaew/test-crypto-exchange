name: NeatJS CI + Seed

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-and-seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run Seeder
        run: npm run seed
